[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kenyalang-ledger-backend"
version = "0.1.0"
description = "Invoice and receipt digitizer backend for Malaysian micro-SMEs and accountants"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
