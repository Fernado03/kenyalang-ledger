services:
  db:
    image: postgres:15-alpine
    container_name: kenyalang-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kenyalang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kenyalang}
      POSTGRES_DB: ${POSTGRES_DB:-kenyalang}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # gen_random_uuid() lives in pgcrypto; init_db also issues the CREATE EXTENSION.
      - ./backend/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kenyalang} -d ${POSTGRES_DB:-kenyalang}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kenyalang-backend
    environment:
      KENYALANG_ENV: local
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-kenyalang}:${POSTGRES_PASSWORD:-kenyalang}@db:5432/${POSTGRES_DB:-kenyalang}
      KENYALANG_STORAGE_ROOT: /data/storage
      KENYALANG_CORS_ORIGINS: ${KENYALANG_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      KENYALANG_LLM_MODEL: ${KENYALANG_LLM_MODEL:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - kenyalang_storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  kenyalang_storage:
